<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flitt one-button wallet demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { font-size: 20px; padding: 8px 10px; width: 100%; box-sizing: border-box; }
    .payment-button-container { margin: 24px 0; min-height: 48px; transition: opacity .2s; }
    .payment-button-container.stale { opacity: .35; pointer-events: none; }
    .switch { display: flex; gap: 8px; margin-bottom: 24px; }
    .switch button { flex: 1; font-size: 15px; padding: 10px; border: 1px solid #111; border-radius: 8px; background: #fff; cursor: pointer; }
    .switch button.active { background: #111; color: #fff; }
    #fallback { display: none; color: #a00; }
    pre { background: #f4f4f4; padding: 12px; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <div class="switch">
    <button type="button" data-wallet="apple">Apple Pay</button>
    <button type="button" data-wallet="google">Google Pay</button>
  </div>
  <h2>Deposit</h2>
  <label for="amount">Amount (GEL)</label>
  <input id="amount" type="text" inputmode="decimal" value="1.00" autocomplete="off" />
  <p>Wallet: <strong id="wallet">detecting…</strong></p>

  <div class="payment-button-container"></div>
  <p id="fallback">No wallet available on this device. Show the card form here instead.</p>
  <p id="status" role="status" aria-live="polite"></p>
  <button id="restart" type="button" hidden>Start a new payment</button>
  <pre id="log"></pre>
  <script src="/wallet-flow.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@flittpayments/js-sdk@2.0.15/dist/umd/checkout.js"></script>
  <script>
    const log = (label, data) =>
      (document.getElementById('log').textContent += label + ' ' + JSON.stringify(data ?? '', null, 2) + '\n');
    const container = document.querySelector('.payment-button-container');
    const amountInput = document.getElementById('amount');

    // ONE button: Apple devices (WebKit exposes ApplePaySession natively) get Apple Pay,
    // everything else gets Google Pay. Decide BEFORE the SDK loads Apple's JS, which would
    // otherwise make Apple Pay (QR flow) look available in desktop Chrome too.
    function pickWallet() {
      const forced = new URLSearchParams(location.search).get('wallet');
      if (forced === 'apple' || forced === 'google') return forced;
      try {
        if (window.ApplePaySession && ApplePaySession.canMakePayments()) return 'apple';
      } catch (e) { /* not a secure context, or not WebKit */ }
      return 'google';
    }

    // "5", "5.5", "5,50" -> 550 tetri. Anything else -> null.
    function toTetri(text) {
      const m = text.trim().replace(',', '.').match(/^(\d{1,7})(?:\.(\d{1,2}))?$/);
      if (!m) return null;
      const tetri = Number(m[1]) * 100 + Number((m[2] || '').padEnd(2, '0'));
      return tetri > 0 && tetri <= 100000000 ? tetri : null;
    }

    const method = pickWallet();
    let paymentButton = null;

    // Demo switch: reload with ?wallet=… (one SDK button per page load), keeping the typed amount.
    const query = new URLSearchParams(location.search);
    if (query.get('amount')) amountInput.value = query.get('amount');
    document.querySelectorAll('.switch button').forEach((b) => {
      b.classList.toggle('active', b.dataset.wallet === method);
      b.addEventListener('click', () => {
        query.set('wallet', b.dataset.wallet);
        query.set('amount', amountInput.value);
        location.search = query.toString();
      });
    });
    let currentOrder = null;

    const statusElement = document.getElementById('status');
    const restart = document.getElementById('restart');
    restart.addEventListener('click', () => { location.href = '/?wallet=' + method; });
    function lock() {
      amountInput.disabled = true;
      document.querySelectorAll('.switch button').forEach(b => b.disabled = true);
      container.classList.add('stale');
    }
    function failure(error) {
      flow.cancel();
      statusElement.textContent = 'Payment not confirmed. ' + String(error?.message || error);
      restart.hidden = false;
    }
    const flow = WalletDemo.createFlow({
      amount: () => toTetri(amountInput.value),
      createOrder: async amountTetri => {
        const response = await fetch('/api/orders', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amountTetri }),
        });
        if (!response.ok) throw new Error('Backend order initialization failed. Payment submission blocked.');
        return response.json();
      },
      onState: (state, error) => {
        lock();
        statusElement.textContent = ({
          opening: 'Complete the wallet prompt.',
          initializing: 'Preparing your order…',
          processing: 'Processing payment…',
          blocked: 'Order initialization failed. Payment was not submitted.',
        })[state];
        if (error) { log('blocked', error.message); restart.hidden = false; }
      },
      onOrder: order => {
        currentOrder = order;
        // Keep the identifier across a full-page 3DS redirect, never wallet credentials.
        sessionStorage.setItem('wallet-order', order.orderId);
        log('order ready', { orderId: order.orderId });
      },
    });

    async function showStatus(orderId) {
      lock();
      restart.hidden = false;
      // Minimal demo: display callback state separately from the gateway status lookup.
      // A redirect or client success event never marks the order as paid.
      const local = await fetch('/api/orders/' + encodeURIComponent(orderId));
      const response = await fetch('/api/orders/' + encodeURIComponent(orderId) + '/status');
      if (!response.ok) throw new Error('Could not check payment. Do not assume it failed.');
      const gateway = await response.json();
      const stored = local.ok ? await local.json() : null;
      log('callback state', stored);
      log('Flitt status', { order_status: gateway.order_status, response_status: gateway.response_status });
      statusElement.textContent = stored?.status === 'approved'
        ? 'Payment confirmed by signed callback.'
        : 'Gateway status: ' + (gateway.order_status || 'unknown') + '. Callback status: ' + (stored?.status || 'unknown') + '.';
    }

    async function init() {
      document.getElementById('wallet').textContent = method === 'apple' ? 'Apple Pay' : 'Google Pay';
      log('env', { origin: location.origin, secureContext: window.isSecureContext, wallet: method });
      if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname))
        log('WARNING', 'Flitt blocks localhost/127.0.0.1 (403) - open http://wallet.localhost:' + location.port + location.search);
      if (method === 'apple' && location.protocol !== 'https:')
        log('WARNING', 'Apple Pay needs HTTPS on a domain registered with Flitt - it will not render here. Try ?wallet=google in Chrome.');

      const returnedOrder = query.get('order');
      if (returnedOrder) {
        await showStatus(returnedOrder);
        return;
      }
      const config = await (await fetch('/api/config')).json();
      const api = WalletDemo.install3dsHandling($checkout.get('Api'), {
        onChallenge: () => {
          lock();
          statusElement.textContent = 'Redirecting to your bank for 3DS verification…';
        },
        onError: failure,
      });
      const fallbackTimer = setTimeout(() => (document.getElementById('fallback').style.display = 'block'), 4000);

      // Client-side mode: merchant_id + amount + currency, no order yet. The button renders on load.
      paymentButton = $checkout
        .get('PaymentButton', {
          api,
          element: '.payment-button-container',
          methods: [method],
          style: { type: 'long', color: 'black', mode: 'pay', height: 48 },
          data: { merchant_id: config.merchantId, currency: config.currency, amount: toTetri(amountInput.value), lang: 'en' },
          // Plain wrapper on purpose: the SDK's isFunction() rejects async functions
          // ([object AsyncFunction]) and silently falls back to its default hook.
          before: function (defer) { flow.before(defer); },
          after: function (defer, params) { flow.after(defer, params); },
        })
        .on('shown:' + method, () => { clearTimeout(fallbackTimer); log('button shown', method); })
        .on('success', async (model) => {
          try {
            // Process SDK redirect/form responses as well as 3DS progress notifications.
            if (model.sendResponse()) return;
            if (model.submitToMerchant()) return;
            if (!currentOrder) throw new Error('Missing backend order; payment status unknown.');
            await showStatus(currentOrder.orderId);
          } catch (error) { failure(error); }
        })
        .on('error', (model) => failure(model.attr ? model.attr('error.message') || 'Wallet/payment error' : model.message || 'Wallet cancelled'));
    }

    // Typing only changes the amount the sheet will show - no transaction is created here.
    let debounce;
    amountInput.addEventListener('input', () => {
      clearTimeout(debounce);
      const tetri = toTetri(amountInput.value);
      container.classList.add('stale');
      if (tetri === null || !paymentButton) return;
      debounce = setTimeout(() => {
        const refresh = paymentButton.update({ amount: tetri });
        if (refresh) refresh.always(() => container.classList.remove('stale'));
        else container.classList.remove('stale');
      }, 300);
    });

    init().catch((e) => log('init failed', String(e)));
  </script>
</body>
</html>
